name: Release

# Setiap tag versi (mis. v1.2.3) membangun APK dan menaruhnya di GitHub Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

      # Tanpa secret ini APK ditandatangani kunci debug, yang berbeda di tiap
      # build, sehingga pengguna tidak bisa update tanpa uninstall dulu.
      - name: Siapkan kunci rilis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64
          --build-name "${GITHUB_REF_NAME#v}"

      - name: Beri nama APK
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk "yumusic-${GITHUB_REF_NAME}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "yumusic-${GITHUB_REF_NAME}-armeabi-v7a.apk"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/yumusic-*.apk
